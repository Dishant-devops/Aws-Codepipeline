version: 0.2

env:
  parameter-store:
    region : region
    ecr_url: ecr-url
    image_name: image-name
phases:
  install:
    runtime-versions:
      nodejs: latest

  pre_build:
    commands:
      - echo "Login aws ecr"
      - aws ecr get-login-password --region "$region"| docker login --username AWS --password-stdin "$ecr_url"

  build:
    commands:
      - echo "Build the Image"
      - docker build -t "$image_name:latest" .
      - echo "Tagging Docker Image"
      - docker tag wetherapp:latest 035680193308.dkr.ecr.ap-southeast-2.amazonaws.com/wetherapp:latest

  post_build:
    commands:
      - echo "Push Image ecr"
      - docker push 035680193308.dkr.ecr.ap-southeast-2.amazonaws.com/wetherapp:latest

  
  


  