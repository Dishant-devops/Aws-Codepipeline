version: 0.2

env:
  parameter-store:
    region : region
    ecr-url: ecr-url
    image-name: image-name
phases:
  install:
    runtime-versions:
      nodejs: latest

  pre_build:
    commands:
      - echo "Login aws ecr"
      - aws ecr get-login-password --region "$region"| docker login --username AWS --password-stdin "$ecr-url"

  build:
    commands:
      - echo "Build the Image"
      - docker build -t "$image-name:latest" .
      - echo "Tagging Docker Image"
      - docker tag "$image-name:latest" "$ecr-url/$image-name:latest"

  post_build:
    commands:
      - echo "Push Image ecr"
      - docker push "$ecr-url/$image-name:latest"

  
  


  